<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가구 데이터 등록 - 하준영 프로젝트</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"], input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 15px; padding: 10px; display: none; border-radius: 5px; }
    </style>
</head>
<body>
<h2>🛋️ 가구 정보 등록</h2>
<form id="productForm">
    <div class="form-group">
        <label>제품명 (product_name)</label>
        <input type="text" name="product_name" placeholder="예: 북유럽풍 패브릭 소파" required>
    </div>

    <div class="form-group">
        <label>제품 이미지 (CLIP 벡터 추출용)</label>
        <input type="file" name="file" accept="image/*" required>
    </div>

    <div class="form-group">
        <label>가로 (product_width, mm)</label>
        <input type="number" step="0.1" name="product_width" value="1200" required>
    </div>

    <div class="form-group">
        <label>깊이 (product_depth, mm)</label>
        <input type="number" step="0.1" name="product_depth" value="800" required>
    </div>

    <div class="form-group">
        <label>높이 (product_height, mm)</label>
        <input type="number" step="0.1" name="product_height" value="450" required>
    </div>

    <div class="form-group">
        <label>재질 (product_material)</label>
        <input type="text" name="product_material" placeholder="예: Wood, Fabric">
    </div>

    <button type="submit">데이터 저장하기</button>
</form>

<div id="status"></div>

<script>
    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const statusDiv = document.getElementById('status');
        const formData = new FormData(e.target);

        statusDiv.style.display = 'block';
        statusDiv.innerText = '데이터 전송 중...';
        statusDiv.style.backgroundColor = '#f8f9fa';

        try {

            const response = await fetch('http://localhost:8080/products/', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                statusDiv.innerText = '✅ 성공: 데이터가 DB에 저장되었습니다!';
                statusDiv.style.backgroundColor = '#d4edda';
                e.target.reset();
            } else {
                const err = await response.text();
                statusDiv.innerText = '❌ 실패: ' + err;
                statusDiv.style.backgroundColor = '#f8d7da';
            }
        } catch (error) {
            statusDiv.innerText = '❌ 오류: 서버에 연결할 수 없습니다. (SSH 터널 확인 필요)';
            statusDiv.style.backgroundColor = '#f8d7da';
        }
    });
</script>
</body>
</html>
