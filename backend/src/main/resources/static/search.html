<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가구 이미지 검색 - 하준영 프로젝트</title>
    <style>
        body { font-family: 'Pretendard', sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        .search-section { background: #f9f9f9; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 40px; }
        .result-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .product-card { border: 1px solid #eee; border-radius: 10px; overflow: hidden; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .product-card img { width: 100%; height: 150px; object-fit: cover; }
        .product-info { padding: 15px; }
        .product-name { font-weight: bold; font-size: 1.1em; margin-bottom: 5px; }
        .product-dim { font-size: 0.9em; color: #666; }
        .similarity-badge { display: inline-block; background: #e7f3ff; color: #007bff; padding: 2px 8px; border-radius: 5px; font-size: 0.8em; margin-top: 5px; }
        #loading { display: none; margin: 20px 0; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>

<div class="search-section">
    <h2>🔍 비슷한 가구 찾기</h2>
    <p>찾고 싶은 가구 사진을 업로드해 주세요.</p>
    <form id="searchForm">
        <input type="file" id="imageInput" name="file" accept="image/*" required>
        <br><br>
        <button type="submit" style="padding: 10px 30px; background: #333; color: white; border: none; border-radius: 5px; cursor: pointer;">검색하기</button>
    </form>
    <div id="loading">AI가 이미지를 분석하고 유사한 가구를 찾는 중...</div>
</div>

<div id="resultArea">
    <div class="result-container" id="resultGrid"></div>
</div>

<script>
    document.getElementById('searchForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const fileInput = document.getElementById('imageInput');
        const resultGrid = document.getElementById('resultGrid');
        const loading = document.getElementById('loading');

        if (!fileInput.files[0]) return;

        // 초기화
        resultGrid.innerHTML = '';
        loading.style.display = 'block';

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            // Spring Boot의 검색 엔드포인트 호출 (SSH 터널링 포트 8080 가정)
            const response = await fetch('http://localhost:8080/products/search', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const data = await response.json(); // List<ProductResponseDto> 수신
                displayResults(data);
            } else {
                alert('검색 중 오류가 발생했습니다.');
            }
        } catch (err) {
            console.error(err);
            alert('서버에 연결할 수 없습니다. SSH 터널링을 확인하세요.');
        } finally {
            loading.style.display = 'none';
        }
    });

    function displayResults(products) {
        const grid = document.getElementById('resultGrid');
        if (products.length === 0) {
            grid.innerHTML = '<p>유사한 가구를 찾지 못했습니다.</p>';
            return;
        }

        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                    <img src="${p.product_image_url}" alt="${p.product_name}">
                    <div class="product-info">
                        <div class="product-name">${p.product_name}</div>
                        <div class="product-dim">${p.product_width} x ${p.product_depth} x ${p.product_height} (mm)</div>
                        <div class="product-dim">재질: ${p.product_material}</div>
                        <div class="similarity-badge">유사도: ${Math.round(p.similarity * 100)}%</div>
                    </div>
                `;
            grid.appendChild(card);
        });
    }
</script>
</body>
</html>
