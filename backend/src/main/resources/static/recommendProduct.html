<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recommend Products Test</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; color: #222; }
    .container { max-width: 960px; margin: 0 auto; }
    form { display: grid; gap: 12px; max-width: 560px; margin-bottom: 24px; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input, button { padding: 10px 12px; font-size: 14px; }
    button { cursor: pointer; width: fit-content; }
    .hint { font-size: 12px; color: #666; font-weight: 400; }
    .status { margin: 12px 0 20px; padding: 12px; background: #f7f7f7; border: 1px solid #ddd; white-space: pre-wrap; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; vertical-align: top; }
    th { background: #f5f5f5; }
    img { max-width: 120px; max-height: 120px; object-fit: cover; display: block; }
    .empty { color: #666; }
  </style>
</head>
<body>
<div class="container">
  <h1>상품 추천 테스트</h1>

  <form id="recommendForm" enctype="multipart/form-data">
    <label>
      카테고리
      <input type="text" name="category" placeholder="예: top">
      <span class="hint">RecommendProductDTO.category</span>
    </label>

    <label>
      이미지
      <input type="file" name="image" accept="image/*" required>
      <span class="hint">RecommendProductDTO.image (MultipartFile)</span>
    </label>

    <label>
      너비(width)
      <input type="number" name="width" placeholder="예: 600" min="0" step="1">
      <span class="hint">RecommendProductDTO.width</span>
    </label>

    <label>
      높이(height)
      <input type="number" name="height" placeholder="예: 800" min="0" step="1">
      <span class="hint">RecommendProductDTO.height</span>
    </label>

    <label>
      깊이(depth)
      <input type="number" name="depth" placeholder="예: 400" min="0" step="1">
      <span class="hint">RecommendProductDTO.depth</span>
    </label>

    <button type="submit">추천 요청</button>
  </form>

  <div id="status" class="status">아직 요청이 없습니다.</div>

  <h2>추천 결과</h2>
  <div id="result" class="empty">응답이 여기에 표시됩니다.</div>
</div>

<script>
  const form = document.getElementById('recommendForm');
  const statusBox = document.getElementById('status');
  const resultBox = document.getElementById('result');

  function renderResults(payload) {
    const data = payload && payload.data;

    if (!Array.isArray(data) || data.length === 0) {
      resultBox.innerHTML = '<p class="empty">추천 결과가 없습니다.</p>';
      return;
    }

    const rows = data.map(item => `
      <tr>
        <td>${item.productId ?? ''}</td>
        <td>${item.productName ?? ''}</td>
        <td>${item.productPrice ?? ''}</td>
        <td>${item.productWidth ?? ''}</td>
        <td>${item.productDepth ?? ''}</td>
        <td>${item.productHeight ?? ''}</td>
        <td>${item.imageUrl ? `<img src="${item.imageUrl}" alt="${item.productName ?? 'product image'}">` : ''}</td>
        <td>${item.modelUrl ? `<a href="${item.modelUrl}" target="_blank" rel="noopener noreferrer">모델 보기</a>` : ''}</td>
      </tr>
    `).join('');

    resultBox.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>상품ID</th>
            <th>상품명</th>
            <th>가격</th>
            <th>너비</th>
            <th>깊이</th>
            <th>높이</th>
            <th>이미지</th>
            <th>모델</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = new FormData(form);
    ['width', 'height', 'depth'].forEach(key => {
      const value = formData.get(key);
      if (value === '') formData.delete(key);
    });

    statusBox.textContent = '요청 중...';
    resultBox.innerHTML = '<p class="empty">응답을 기다리는 중입니다.</p>';

    try {
      const res = await fetch('http://158.179.167.248:8080/api/recommend', {
        method: 'POST',
        body: formData
      });

      const text = await res.text();
      let payload;
      try {
        payload = text ? JSON.parse(text) : null;
      } catch {
        throw new Error('서버 응답이 JSON 형식이 아닙니다: ' + text);
      }

      statusBox.textContent = payload?.message ?? `HTTP ${res.status}`;

      if (!res.ok || payload?.success === false) {
        resultBox.innerHTML = `<pre class="empty">${JSON.stringify(payload, null, 2)}</pre>`;
        return;
      }

      renderResults(payload);
    } catch (error) {
      statusBox.textContent = '요청 실패';
      resultBox.innerHTML = `<pre class="empty">${error.message}</pre>`;
    }
  });
</script>
</body>
</html>
