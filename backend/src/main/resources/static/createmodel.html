<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create 3D Model</title>
</head>
<body>
    <h1>3D 모델 생성 요청</h1>
    <form id="modelForm">
        <label for="productId">Product ID:</label>
        <input type="text" id="productId" name="productId" required><br><br>

        <label for="imageFront">Front Image:</label>
        <input type="file" id="imageFront" name="imageFront" accept="image/*"><br><br>

        <label for="imageLeft">Left Image:</label>
        <input type="file" id="imageLeft" name="imageLeft" accept="image/*"><br><br>

        <label for="imageRight">Right Image:</label>
        <input type="file" id="imageRight" name="imageRight" accept="image/*"><br><br>

        <label for="imageBack">Back Image:</label>
        <input type="file" id="imageBack" name="imageBack" accept="image/*"><br><br>

        <button type="submit">생성 요청</button>
    </form>

    <div id="response" style="margin-top: 20px; font-weight: bold;"></div>

    <script>
        document.getElementById('modelForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const formData = new FormData(this);
            const responseDiv = document.getElementById('response');
            responseDiv.innerText = '요청을 보내는 중...';

            try {
                const response = await fetch('http://localhost:8080/models', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const text = await response.text();
                    responseDiv.innerText = text;
                } else {
                    responseDiv.innerText = '요청 실패: ' + response.status;
                }
            } catch (error) {
                responseDiv.innerText = '오류 발생: ' + error.message;
            }
        });
    </script>
</body>
</html>
